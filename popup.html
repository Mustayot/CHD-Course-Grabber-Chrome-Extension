<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 13px;
            color: #333;
            margin: 0;
            padding: 16px;
            background: #f8fafc;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #1a56db;
        }
        .row {
            margin-bottom: 10px;
        }
        .desc {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .btn-primary {
            background: #1a56db;
            color: #fff;
        }
        .btn-ghost {
            background: #e5e7eb;
            color: #333;
        }
        .status {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            color: #555;
            margin-bottom: 12px;
        }
        .status b {
            color: #1a56db;
        }
        .footer {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h2>🎯 长大教务抢课助手</h2>
    <div class="status" id="status">扩展已加载，等待打开选课页面...</div>
    <div class="desc">
        打开教务选课页后，页面右上角会出现抢课面板。<br>
        使用方法：登录教务系统 → 进入选课 → 添加目标课程 → 开始抢课。
    </div>
    <button class="btn btn-primary" id="open-elect">打开选课页面</button>
    <button class="btn btn-ghost" id="open-readme">查看使用说明</button>
    <div class="footer">v1.0.0</div>

    <script src="popup.js"></script>
</body>
</html>
